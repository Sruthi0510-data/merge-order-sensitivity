<svg xmlns="http://www.w3.org/2000/svg" width="608" height="404" viewBox="0 0 608 404" role="img"><defs><marker id="head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b6b5a"/></marker><marker id="head-blocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker></defs><rect x="0" y="0" width="608" height="404" fill="#fbfbfa"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start">The space a permutation harness can search</text><text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">109 keys straddle a batch boundary in the fixture</text><rect x="24" y="86" width="560" height="52" rx="6" fill="#fdecec" stroke="#b42318" stroke-width="1.5"/><rect x="24" y="86" width="418" height="52" rx="6" fill="#e8f3f0" stroke="#0b6b5a" stroke-width="1.5"/><text x="42" y="117" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b6b5a" font-weight="bold" text-anchor="start">10,046 are reachable</text><text x="24" y="160" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">13,449 arrival orders exist across the fixture</text><text x="584" y="160" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#b42318" font-weight="bold" text-anchor="end">3,403 orders no shuffle can produce</text><text x="24" y="208" font-family="Helvetica,Arial,sans-serif" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">What that costs a sampling harness</text><rect x="24" y="221" width="560" height="30" rx="4" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="42" y="240" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="start">32 order-dependent keys</text><text x="268" y="240" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">proved by the audit</text><rect x="24" y="259" width="560" height="30" rx="4" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="42" y="278" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#0b6b5a" font-weight="bold" text-anchor="start">18 found by the harness</text><text x="268" y="278" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">a ceiling of 56.2% reached after 5 draws</text><rect x="24" y="297" width="560" height="30" rx="4" fill="#ffffff" stroke="#8c959f" stroke-width="1"/><text x="42" y="316" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#b42318" font-weight="bold" text-anchor="start">14 never found</text><text x="268" y="316" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">still 14 at 2,000 draws</text><text x="24" y="378" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">zero hits across the unreachable population bounds detection below 21.4%, which is not zero</text></svg>