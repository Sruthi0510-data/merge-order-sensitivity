<svg xmlns="http://www.w3.org/2000/svg" width="712" height="508" viewBox="0 0 712 508" role="img"><defs><marker id="head-line" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker><marker id="head-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0b6b5a"/></marker><marker id="head-blocked" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker></defs><rect x="0" y="0" width="712" height="508" fill="#fbfbfa"/><text x="24" y="34" font-family="Helvetica,Arial,sans-serif" font-size="17" fill="#1f2328" font-weight="bold" text-anchor="start">Three arms over the same stream</text><text x="24" y="56" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#57606a" font-weight="normal" text-anchor="start">1,250 events, 400 keys, 6 micro-batches</text><rect x="70" y="80" width="300" height="62" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/><text x="88" y="104" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#1f2328" font-weight="bold" text-anchor="start">CDC event stream</text><text x="88" y="124" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">as delivered, in arrival order</text><polyline points="120,142 120,160 44,160 44,389" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-linejoin="round"/><line x1="44" y1="209" x2="66" y2="209" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><rect x="70" y="176" width="300" height="70" rx="6" fill="#ffffff" stroke="#0b6b5a" stroke-width="1.5"/><text x="88" y="200" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#0b6b5a" font-weight="bold" text-anchor="start">Arm 1   control</text><text x="88" y="219" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">re-run in the same order</text><text x="88" y="236" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="normal" text-anchor="start">flags 0 keys</text><line x1="370" y1="211" x2="436" y2="211" stroke="#0b6b5a" stroke-width="1.5" marker-end="url(#head-accent)"/><line x1="44" y1="299" x2="66" y2="299" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><rect x="70" y="266" width="300" height="70" rx="6" fill="#ffffff" stroke="#0b6b5a" stroke-width="1.5"/><text x="88" y="290" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#0b6b5a" font-weight="bold" text-anchor="start">Arm 2   reachable</text><text x="88" y="309" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">shuffle inside each micro-batch</text><text x="88" y="326" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="normal" text-anchor="start">finds 18 of 32 order-dependent keys</text><line x1="370" y1="301" x2="436" y2="301" stroke="#0b6b5a" stroke-width="1.5" marker-end="url(#head-accent)"/><line x1="44" y1="389" x2="66" y2="389" stroke="#8c959f" stroke-width="1.5" marker-end="url(#head-line)"/><rect x="70" y="356" width="300" height="70" rx="6" fill="#ffffff" stroke="#b42318" stroke-width="1.5" stroke-dasharray="5 3"/><text x="88" y="380" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#b42318" font-weight="bold" text-anchor="start">Arm 3   unreachable</text><text x="88" y="399" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">swap across a batch boundary</text><text x="88" y="416" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="normal" text-anchor="start">14 keys only this arm sees</text><line x1="370" y1="391" x2="436" y2="391" stroke="#b42318" stroke-width="1.5" marker-end="url(#head-blocked)" stroke-dasharray="5 3"/><rect x="440" y="176" width="248" height="250" rx="6" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text x="458" y="204" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">referee</text><text x="458" y="226" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">resolves each key from the</text><text x="458" y="242" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">event multiset, never its order</text><text x="458" y="274" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#0b6b5a" font-weight="bold" text-anchor="start">Decided</text><text x="524" y="274" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="normal" text-anchor="start">one row is entitled</text><text x="458" y="294" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#8a3b12" font-weight="bold" text-anchor="start">Ambiguous</text><text x="534" y="294" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#1f2328" font-weight="normal" text-anchor="start">no row is entitled</text><text x="458" y="328" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">breaks the symmetry that a</text><text x="458" y="344" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">run-versus-run diff cannot</text><text x="458" y="382" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#1f2328" font-weight="bold" text-anchor="start">32 order-dependent keys</text><text x="458" y="400" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">each with a replayable witness</text><text x="24" y="464" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">the dashed arm models nothing a pipeline can do: 3,403 of 13,449 arrival orders are</text><text x="24" y="482" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#57606a" font-weight="normal" text-anchor="start">unreachable once a micro-batch has been committed</text></svg>